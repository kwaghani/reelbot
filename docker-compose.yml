services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: reelbot
      POSTGRES_USER: reelbot
      POSTGRES_PASSWORD: reelbot-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelbot -d reelbot"]
      interval: 5s
      timeout: 3s
      retries: 20
