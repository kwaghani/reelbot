services:
  - type: web
    name: reelbot-api
    runtime: docker
    plan: starter
    branch: codex/render-restore
    autoDeployTrigger: off
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./deploy/render/start-personal-api.sh
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.krishwaghani.reelbot
  - type: worker
    name: reelbot-worker
    runtime: docker
    plan: standard
    branch: codex/render-restore
    autoDeployTrigger: off
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./deploy/render/start-personal-worker.sh
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_FAST_MODEL
        value: claude-haiku-4-5-20251001
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: REELBOT_ENABLE_VIDEO_DOWNLOAD
        value: "true"
      - key: REELBOT_ENABLE_TRANSCRIPTION
        value: "true"
      - key: IG_COOKIES_PATH
        value: ""
