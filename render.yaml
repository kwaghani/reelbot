services:
  - type: web
    name: reelbot-api
    runtime: docker
    plan: starter
    autoDeployTrigger: commit
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./deploy/render/start-personal-api.sh
    healthCheckPath: /healthz
    preDeployCommand: ./deploy/render/pre-deploy.sh
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: reelbot-shared
      - key: REELBOT_SERVICE_ROLE
        value: api
      - key: APPLE_BUNDLE_ID
        value: com.krishwaghani.reelbot
  - type: worker
    name: reelbot-worker
    runtime: docker
    plan: standard
    autoDeployTrigger: commit
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./deploy/render/start-personal-worker.sh
    preDeployCommand: ./deploy/render/pre-deploy.sh
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: reelbot-shared
      - key: REELBOT_SERVICE_ROLE
        value: worker
      - key: ANTHROPIC_FAST_MODEL
        value: claude-haiku-4-5-20251001
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: REELBOT_ENABLE_VIDEO_DOWNLOAD
        value: "true"
      - key: REELBOT_ENABLE_TRANSCRIPTION
        value: "true"
  - type: cron
    name: reelbot-backup
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 3 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/backup.sh
    envVars:
      - fromGroup: reelbot-shared

databases:
  - name: reelbot-db
    plan: 0.1c-256mb
    region: oregon
